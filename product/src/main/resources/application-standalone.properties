# Standalone profile: run product-service without PostgreSQL/Keycloak.
# H2 in PostgreSQL compatibility mode replaces the real database.
# Security is disabled via StandaloneSecurityConfig (@Profile("standalone")).

server.port=8080
server.servlet.context-path=/product

spring.application.name=product

# expose health endpoint for k8s liveness/readiness probes
management.endpoints.web.exposure.include=health,prometheus

# --- H2 in-memory database (PostgreSQL compatibility) ---
# NON_KEYWORDS: 'value' is a reserved word in H2 but a valid column name in
# PostgreSQL (used in the YAS changelogs). Treat it as an identifier.
spring.datasource.url=jdbc:h2:mem:product;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Liquibase still runs the changelogs (H2 MODE=PostgreSQL tolerates most syntax)
spring.liquibase.enabled=true

# media/rating services: leave unreachable — Resilience4j circuit breaker
# falls back gracefully to empty results.
yas.services.media=http://localhost:9999/media
yas.services.rating=http://localhost:9999/rating

resilience4j.retry.instances.rest-api.max-attempts=1
resilience4j.circuitbreaker.instances.rest-circuit-breaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.rest-circuit-breaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.rest-circuit-breaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.rest-circuit-breaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.rest-circuit-breaker.permitted-number-of-calls-in-half-open-state=3

cors.allowed-origins=*
